<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f5" />
    <title>五子棋</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="brand-copy">
          <span class="brand-title">五子棋</span>
            <span>双人对弈</span>
          </span>
        </div>
      </header>

      <main class="game-layout">
        <h1 class="visually-hidden">五子棋</h1>
        <div class="game-toolbar" aria-label="对局工具">
          <div class="mode-switch" role="group" aria-label="对战模式">
            <button
              id="local-mode"
              class="active"
              type="button"
              aria-pressed="true"
              aria-controls="online-panel"
            >
              <i data-lucide="users-round" aria-hidden="true"></i>
              <span>同机双人</span>
            </button>
            <button
              id="online-mode"
              type="button"
              aria-pressed="false"
              aria-controls="online-panel"
            >
              <i data-lucide="globe-2" aria-hidden="true"></i>
              <span>在线房间</span>
            </button>
          </div>

          <div class="history-actions" aria-label="棋局操作">
            <button id="undo" class="icon-button" type="button" aria-label="悔棋" title="悔棋" disabled>
              <i data-lucide="undo-2" aria-hidden="true"></i>
            </button>
            <button id="redo" class="icon-button" type="button" aria-label="重做" title="重做" disabled>
              <i data-lucide="redo-2" aria-hidden="true"></i>
            </button>
            <button
              id="reset"
              class="icon-button new-game-button"
              type="button"
              aria-label="重新开局"
              aria-haspopup="dialog"
              aria-controls="new-game-dialog"
              title="重新开局"
            >
              <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <section class="turn-panel" aria-label="对局状态">
          <div id="black-player" class="player-summary active" aria-current="true">
            <span class="player-stone black" aria-hidden="true"></span>
            <span class="player-name">黑方</span>
          </div>

          <div class="match-status">
            <p id="identity">同机双人</p>
            <div class="status-line">
              <span id="status-stone" class="status-stone black" aria-hidden="true"></span>
              <p id="status" role="status" aria-live="polite" aria-atomic="true">轮到黑方</p>
            </div>
            <p id="move-count">第 0 手</p>
          </div>

          <div id="white-player" class="player-summary">
            <span class="player-stone white" aria-hidden="true"></span>
            <span class="player-name">白方</span>
          </div>
        </section>

        <section class="board-area" aria-labelledby="board-title">
          <h2 id="board-title" class="visually-hidden">十五路五子棋棋盘</h2>
          <div class="board-frame">
            <canvas
              id="board"
              tabindex="0"
              role="application"
              aria-roledescription="五子棋棋盘"
              aria-label="轮到黑方，当前选择 H8"
              aria-describedby="board-help"
            ></canvas>
          </div>
          <div class="board-footer" aria-label="棋盘信息">
            <span>15 × 15</span>
            <span id="last-move-label" aria-live="polite">最后一手：暂无</span>
          </div>
          <p id="board-help" class="visually-hidden">
            使用方向键移动选择位置，按空格键或回车键落子。
          </p>
        </section>

        <aside class="control-panel" aria-label="在线房间">
          <section id="online-panel" class="online-panel" aria-labelledby="online-title" hidden>
            <header class="section-heading">
              <div>
                <p>ONLINE</p>
                <h2 id="online-title">加入房间</h2>
              </div>
              <span class="connection-mark" aria-hidden="true"></span>
            </header>

            <label class="field">
              <span>房间代码</span>
              <input
                id="room-code"
                placeholder="ABC123"
                maxlength="20"
                inputmode="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
              />
            </label>

            <div class="connection-actions">
              <button id="connect" class="primary" type="button">连接房间</button>
              <button id="disconnect" type="button" disabled>断开</button>
            </div>

            <details class="advanced-settings">
              <summary>高级连接设置</summary>
              <label class="field">
                <span>服务器地址</span>
                <input id="server-url" value="ws://127.0.0.1:8787" inputmode="url" autocomplete="url" />
              </label>
            </details>
          </section>
        </aside>
      </main>
    </div>

    <dialog id="new-game-dialog" aria-labelledby="new-game-title" aria-describedby="new-game-description">
      <form method="dialog">
        <div class="dialog-heading">
          <span class="dialog-icon" aria-hidden="true">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          </span>
          <div>
            <h2 id="new-game-title">重新开局？</h2>
            <p id="new-game-description">当前棋局将被清空，这项操作无法撤销。</p>
          </div>
        </div>
        <div class="dialog-actions">
          <button id="cancel-new-game" value="cancel" type="button">取消</button>
          <button id="confirm-new-game" class="danger" value="confirm" type="button">重新开局</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
