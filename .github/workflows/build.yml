name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun audit
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version package.json)" = "$expected"
          test "$(jq -r .version src-tauri/tauri.conf.json)" = "$expected"
          test "$(sed -n 's/^version = \"\(.*\)\"/\1/p' src-tauri/Cargo.toml | head -n 1)" = "$expected"
      - run: bun run test:unit
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  windows:
    name: Windows EXE
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --bundles nsis
      - name: Prepare Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/Gomoku_${version}_x64-setup.exe"
          Copy-Item $installer.FullName "release-assets/Gomoku_windows_x64_setup.exe"
          $hash = (Get-FileHash "release-assets/Gomoku_windows_x64_setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Gomoku_windows_x64_setup.exe" | Out-File -Encoding ascii "release-assets/Gomoku_windows_x64_setup.exe.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gomoku-windows-exe
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Android signed ARM64 APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run android:build -- --apk --target aarch64
      - name: Sign and verify ARM64 APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p release-assets
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          test -n "$unsigned"
          keystore="$RUNNER_TEMP/gomoku-release.jks"
          signed="release-assets/Gomoku_android_arm64_release.apk"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed" "$unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$signed"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed" | tee release-assets/apksigner-verify.txt
          grep -F "Signer #1 certificate SHA-256 digest: c5bbb8806b7034dbc4ab65652c3f89839f057d782df31ece4e8125f5792e5333" release-assets/apksigner-verify.txt
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$signed")"
          version_code="$(sed -n 's/^tauri.android.versionCode=//p' src-tauri/gen/android/app/tauri.properties)"
          test "$version_code" = "3000"
          grep -F "package: name='com.xqd922.gomoku'" <<< "$badging"
          grep -F "versionCode='$version_code'" <<< "$badging"
          grep -F "versionName='$(jq -r .version package.json)'" <<< "$badging"
          grep -F "minSdkVersion:'24'" <<< "$badging"
          grep -F "targetSdkVersion:'36'" <<< "$badging"
          native_code="$(grep '^native-code:' <<< "$badging")"
          test "$native_code" = "native-code: 'arm64-v8a'"
          (cd release-assets && sha256sum Gomoku_android_arm64_release.apk > Gomoku_android_arm64_release.apk.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gomoku-android-apk
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gomoku-windows-exe
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gomoku-android-apk
          path: release-assets
      - name: Create combined checksums
        shell: bash
        run: |
          (cd release-assets && sha256sum *.exe *.apk > SHA256SUMS.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f)
          test "${#assets[@]}" -gt 0
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes "The Android APK uses the release certificate. Users upgrading from older debug builds may need to uninstall first. The Windows installer is not Authenticode-signed and may show a SmartScreen warning. Online play requires a self-hosted WebSocket server; use wss:// on public networks." \
              --title "Gomoku $GITHUB_REF_NAME"
          fi
