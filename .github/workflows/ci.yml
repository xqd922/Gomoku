name: Gomoku

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gomoku-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PUB_HOSTED_URL: https://pub.dev

jobs:
  verify:
    name: Rules, backend, browser and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: tool/browser/package-lock.json
      - name: Check release version
        run: python3 tool/package_release.py check-version
      - run: dart tool/bootstrap.dart
      - run: docker compose up -d --wait
      - run: bash tool/check.sh --with-backend
      - name: Build the self-contained Web app
        run: |
          cd apps/gomoku_app
          flutter build web --release --no-web-resources-cdn --no-pub
          cd ../..
          dart tool/prepare_web.dart
      - name: Start the application for browser tests
        run: |
          mkdir -p .local
          (cd apps/server && dart bin/main.dart --apply-migrations --server-id ci-web) >.local/web-server.log 2>&1 &
          dart tool/dev_gateway.dart >.local/web-gateway.log 2>&1 &
      - name: Browser verification
        run: |
          cd tool/browser
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification
          path: |
            artifacts/browser
            .local/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Check deployment images
        run: |
          docker build -f infra/server.Dockerfile -t gomoku-server:ci .
          docker build -f infra/web.Dockerfile -t gomoku-web:ci .
      - name: Package Web
        run: python3 tool/package_release.py web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-web
          path: artifacts/releases/*
          if-no-files-found: error
          compression-level: 0
      - if: always()
        run: docker compose down

  native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-24.04
            target: linux
          - os: ubuntu-24.04
            target: apk
          - os: macos-latest
            target: macos
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOMOKU_API_URL: ${{ vars.GOMOKU_API_URL }}
      GOMOKU_AUTH_URL: ${{ vars.GOMOKU_AUTH_URL }}
      GOMOKU_WEB_URL: ${{ vars.GOMOKU_WEB_URL }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev libblkid-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get --enforce-lockfile
      - name: Check release version
        run: python tool/package_release.py check-version
      - name: Build platform
        shell: bash
        run: |
          set -euo pipefail
          options=(--release --no-pub)
          if [[ -n "$GOMOKU_API_URL$GOMOKU_AUTH_URL$GOMOKU_WEB_URL" ]]; then
            [[ "$GOMOKU_API_URL" == https://*/ ]]
            [[ "$GOMOKU_AUTH_URL" == https://*/ ]]
            [[ "$GOMOKU_WEB_URL" == https://* ]]
            options+=("--dart-define=GOMOKU_API_URL=$GOMOKU_API_URL")
            options+=("--dart-define=GOMOKU_AUTH_URL=$GOMOKU_AUTH_URL")
            options+=("--dart-define=GOMOKU_WEB_URL=$GOMOKU_WEB_URL")
          fi
          if [[ "$BUILD_TARGET" == ios ]]; then
            options+=(--no-codesign)
          fi
          cd apps/gomoku_app
          flutter build "$BUILD_TARGET" "${options[@]}"
      - name: Package platform
        shell: bash
        run: python tool/package_release.py "$BUILD_TARGET"
      - name: Sign Android with the existing release certificate
        if: matrix.target == 'apk' && github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          packages=(artifacts/releases/Gomoku-*-android.apk)
          test "${#packages[@]}" -eq 1
          bash tool/sign_android.sh "${packages[0]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-${{ matrix.target }}
          path: artifacts/releases/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [verify, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: distribution-*
          merge-multiple: true
          path: artifacts/releases
      - name: Verify all six packages and create checksums
        run: |
          python3 tool/package_release.py manifest
          cd artifacts/releases
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true || {
              echo 'This release is already published; published assets are immutable.' >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$GITHUB_SHA" --draft \
              --title "Gomoku $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/releases/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest --notes-file "$notes"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
