name: Gomoku

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gomoku-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PUB_HOSTED_URL: https://pub.dev
  GOMOKU_API_URL: ${{ vars.GOMOKU_API_URL || 'https://gomoku.xqd.pp.ua/api/' }}
  GOMOKU_AUTH_URL: ${{ vars.GOMOKU_AUTH_URL || 'https://gomoku.xqd.pp.ua/auth/' }}
  GOMOKU_WEB_URL: ${{ vars.GOMOKU_WEB_URL || 'https://gomoku.xqd.pp.ua' }}

jobs:
  verify:
    name: Rules, backend, browser and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: tool/browser/package-lock.json
      - name: Check release version
        run: python3 tool/package_release.py check-version
      - run: dart tool/bootstrap.dart
      - run: docker compose up -d --wait
      - run: bash tool/check.sh --with-backend
      - name: Build the self-contained Web app
        run: |
          cd apps/gomoku_app
          flutter build web --release --no-web-resources-cdn --no-pub
          cd ../..
          dart tool/prepare_web.dart
      - name: Start the application for browser tests
        run: |
          mkdir -p .local
          (cd apps/server && dart bin/main.dart --apply-migrations --server-id ci-web) >.local/web-server.log 2>&1 &
          dart tool/dev_gateway.dart >.local/web-gateway.log 2>&1 &
      - name: Prepare browser
        timeout-minutes: 4
        run: |
          cd tool/browser
          npm ci
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -n "$chrome" ]]; then
            "$chrome" --version
            echo "GOMOKU_CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          else
            timeout 180s npx playwright install --with-deps --only-shell chromium
          fi
      - name: Browser verification
        timeout-minutes: 10
        env:
          GOMOKU_WEB_URL: http://localhost:4280
        run: |
          cd tool/browser
          npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification
          path: |
            artifacts/browser
            .local/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Check deployment images
        run: |
          docker build -f infra/server.Dockerfile -t gomoku-server:ci .
          docker build -f infra/web.Dockerfile -t gomoku-web:ci .
      - name: Package Web
        run: |
          python3 tool/check_release_config.py
          cd apps/gomoku_app
          flutter build web --release --no-web-resources-cdn --no-pub \
            --dart-define=GOMOKU_API_URL="$GOMOKU_API_URL" \
            --dart-define=GOMOKU_AUTH_URL="$GOMOKU_AUTH_URL" \
            --dart-define=GOMOKU_WEB_URL="$GOMOKU_WEB_URL"
          cd ../..
          dart tool/prepare_web.dart
          python3 tool/package_release.py web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-web
          path: artifacts/releases/*
          if-no-files-found: error
          compression-level: 0
      - if: always()
        run: docker compose down

  server:
    name: Build Debian 12 server
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-web
          path: artifacts/releases
      - name: Compile AOT on Debian 12
        run: docker build -f infra/native/server-build.Dockerfile --output type=local,dest=artifacts/native .
      - name: Assemble server, migrations and Web assets
        run: |
          mkdir -p apps/gomoku_app/build/web
          unzip -q artifacts/releases/Gomoku-*-web.zip -d apps/gomoku_app/build/web
          python3 tool/package_release.py server
          tar -tzf artifacts/releases/Gomoku-*-server-debian12-x64.tar.gz | head -30 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-server
          path: artifacts/releases/*-server-debian12-x64.tar.gz
          if-no-files-found: error
          compression-level: 0

  native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-24.04
            target: linux
          - os: ubuntu-24.04
            target: apk
          - os: macos-latest
            target: macos
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev libblkid-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get --enforce-lockfile
      - name: Check release version
        run: python tool/package_release.py check-version
      - name: Build platform
        shell: bash
        run: |
          set -euo pipefail
          python tool/check_release_config.py
          options=(--release --no-pub)
          options+=("--dart-define=GOMOKU_API_URL=$GOMOKU_API_URL")
          options+=("--dart-define=GOMOKU_AUTH_URL=$GOMOKU_AUTH_URL")
          options+=("--dart-define=GOMOKU_WEB_URL=$GOMOKU_WEB_URL")
          if [[ "$BUILD_TARGET" == ios ]]; then
            options+=(--no-codesign)
          fi
          cd apps/gomoku_app
          flutter build "$BUILD_TARGET" "${options[@]}"
      - name: Package platform
        shell: bash
        run: python tool/package_release.py "$BUILD_TARGET"
      - name: Sign Android with the existing release certificate
        if: matrix.target == 'apk' && github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          packages=(artifacts/releases/Gomoku-*-android.apk)
          test "${#packages[@]}" -eq 1
          bash tool/sign_android.sh "${packages[0]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-${{ matrix.target }}
          path: artifacts/releases/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [verify, native, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: distribution-*
          merge-multiple: true
          path: artifacts/releases
      - name: Verify six client packages and server; create checksums
        run: |
          python3 tool/package_release.py manifest
          cd artifacts/releases
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME%%-rc.*}"
          notes="docs/releases/$version.md"
          test -f "$notes"
          if [[ "$GITHUB_REF_NAME" != *-rc.* ]]; then
            python3 tool/check_release_acceptance.py
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true || {
              echo 'This release is already published; published assets are immutable.' >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$GITHUB_SHA" --draft \
              --title "Gomoku $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/releases/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease --latest=false --notes-file "$notes"
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft=false --prerelease=false --latest --notes-file "$notes"
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
