name: gomoku_flutter
description: A thoughtful, expressive Gomoku game for every screen.
publish_to: none
version: 1.1.0+10100
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: 1.0.8
  gomoku_core:
    path: ../../packages/gomoku_core
  gomoku_client:
    path: ../../packages/gomoku_client
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  dynamic_color: 1.9.0
  drift: 2.35.0
  drift_flutter: 0.3.1
  flutter_secure_storage: 11.1.0
  shared_preferences: 2.5.5
  uuid: 4.6.0
  http: 1.6.0
  web: 1.1.1
  audioplayers: 6.8.1
dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  build_runner: 2.16.1
  drift_dev: 2.35.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
