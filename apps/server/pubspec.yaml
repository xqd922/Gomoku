name: gomoku_server
description: Authoritative Gomoku rooms, identity, and record synchronization.
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.13.0
resolution: workspace
dependencies:
  serverpod: 3.4.13
  serverpod_auth_idp_server: 3.4.13
  gomoku_core:
    path: ../../packages/gomoku_core
  crypto: 3.0.7
  mailer: 6.6.0
  http: 1.6.0
  uuid: 4.6.0
dev_dependencies:
  gomoku_client:
    path: ../../packages/gomoku_client
  postgres: 3.5.12
  lints: 6.1.0
  serverpod_test: 3.4.13
  test: 1.31.1
serverpod:
  scripts:
    start: dart bin/main.dart --apply-migrations
